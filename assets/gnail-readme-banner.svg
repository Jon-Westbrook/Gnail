<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">GNAIL — Nail those gmails to the wall!</title>
  <desc id="desc">A neon-pink GNAIL wordmark with an envelope and lightning bolt on a dark plum background.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#160e1a"/>
      <stop offset="1" stop-color="#090910"/>
    </linearGradient>
    <linearGradient id="pink" x2="1" y2="1">
      <stop stop-color="#ff8bc9"/>
      <stop offset="1" stop-color="#e83b9f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".45" fill="#fff" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1000" height="300" rx="18" fill="url(#background)"/>
  <rect width="1000" height="300" rx="18" fill="url(#grain)" opacity=".35"/>
  <g transform="translate(78 87)" filter="url(#glow)">
    <path d="M0 20 62 20 62 76 0 76Z" fill="none" stroke="#f044a6" stroke-width="7" stroke-linejoin="round"/>
    <path d="m2 24 29 22 29-22" fill="none" stroke="#f044a6" stroke-width="6" stroke-linejoin="round"/>
    <path d="m37 0-21 39h17l-7 48 34-58H40l10-29Z" fill="#f8e8f1"/>
  </g>
  <text x="190" y="157" fill="url(#pink)" font-family="Arial, Helvetica, sans-serif" font-size="126" font-style="italic" font-weight="900" letter-spacing="11">GNAIL</text>
  <text x="82" y="239" fill="#b8a9c2" font-family="Courier New, monospace" font-size="31" letter-spacing="4">Nail those gmails to the wall!</text>
</svg>
